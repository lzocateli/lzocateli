name: Atualizar estatísticas do perfil

on:
    workflow_dispatch:
    schedule:
        - cron: "17 3 * * *"

permissions:
    contents: write

concurrency:
    group: update-profile-stats
    cancel-in-progress: true

jobs:
    update-readme:
        name: Atualizar README pela GitHub API
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Obter repositório
              uses: actions/checkout@v4

            - name: Configurar Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Gerar estatísticas
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: >-
                  python .github/scripts/update_readme_stats.py --username lzocateli --readme README.md --timezone America/Sao_Paulo

            - name: Publicar atualização
              run: |
                  if git diff --quiet -- README.md; then
                    echo "Nenhuma alteração nas estatísticas."
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add README.md
                  git commit -m "chore(readme): atualizar estatísticas do perfil"
                  git push
